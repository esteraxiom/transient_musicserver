name: Test, build, and deploy

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  build-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/mistress'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: true
          build-args: |
            YT_DLP_VERSION=2026.8.19
          tags: |
            ghcr.io/esteraxiom/transient-musicserver:mistress
            ghcr.io/esteraxiom/transient-musicserver:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=musicserver
          cache-to: type=gha,mode=max,scope=musicserver

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/mistress'
    needs: build-image
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    concurrency:
      group: production
      cancel-in-progress: true
    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
        run: |
          curl \
            --fail-with-body \
            --retry 3 \
            --retry-all-errors \
            --request GET \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${COOLIFY_WEBHOOK}"
