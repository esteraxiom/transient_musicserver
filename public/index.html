<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>musicserver</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <header class="masthead">
      <div>
        <p class="eyebrow">tailnet audio cache</p>
        <h1>musicserver</h1>
      </div>
      <span class="host-mark">m.core</span>
    </header>

    <section id="storage-section" aria-labelledby="storage-label">
      <div class="storage-copy">
        <span id="storage-label">storage</span>
        <span id="storage-display">checking...</span>
      </div>
      <div class="storage-track" role="progressbar" aria-label="Music library storage" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <span id="storage-fill"></span>
      </div>
    </section>

    <section id="form-section">
      <form id="download-form">
        <label class="sr-only" for="url-input">YouTube URL</label>
        <input type="url" id="url-input" placeholder="youtube url" required>
        <label class="sr-only" for="title-input">Custom track title</label>
        <input type="text" id="title-input" placeholder="custom title (optional)">
        <button type="submit" id="submit-btn">download</button>
      </form>
    </section>

    <section id="status-section" hidden>
      <div id="status-display" role="status" aria-live="polite"></div>
    </section>

    <section id="tracks-section">
      <div class="section-heading">
        <h2>tracks</h2>
        <button type="button" id="refresh-btn">refresh</button>
      </div>
      <ul id="tracks-list"></ul>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
