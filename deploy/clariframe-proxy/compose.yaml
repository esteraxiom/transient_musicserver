services:
  proxy:
    build:
      context: .
      dockerfile: Containerfile
    image: transient-musicserver-clariframe-proxy:1.0.0
    container_name: transient-musicserver-clariframe-proxy
    network_mode: host
    restart: unless-stopped
    read_only: true
    user: "65534:65534"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 64m
    cpus: 0.25
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=4m,uid=65534,gid=65534
    healthcheck:
      test: ["CMD", "pidof", "tinyproxy"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
